# OpenSpec Configuration
schema: 1

project:
  name: food-agent
  repository: cesarchavezcal/food-agent
  type: agentic-web-application
  description: Personal diet-tracking AI agent based on the Mexican SMAE with deterministic nutritional math on a $0 stack.
  stack:
    language: typescript
    frameworks: ["eve", "ai-sdk", "drizzle", "nextjs"]
    package_manager: npm
    build_tool: next

testing:
  runner: vitest
  framework: vitest
  layers: ["unit", "integration"]
  coverage_tool: v8
  strict_tdd: true
  reason_strict_tdd_disabled: null
  command: "npx vitest run"

quality:
  linter: gga
  linter_config: .gga
  formatter: prettier
  type_checker: tsc

conventions:
  git:
    branch_pattern: "{prefix}/CCH/{project-initials}-{ticket-number}-{ticket-summary}"
    commit_pattern: "<prefix>(<scope>): <summary>"
    pr_template: ".github/PULL_REQUEST_TEMPLATE.md"
  pipeline:
    explore:
      command: "/product-function"
      secondary: "/grill-with-docs"
    spec:
      command: "/to-spec"
    design:
      command: "/ia"
      secondary: "/ooux"
    tasks:
      command: "/to-tickets"
    apply:
      executor: "/implement"
      worker: "/harness"
      swarm: "/team-cheap"
    verify:
      review: "/code-review"
      gate: ".gga"
    archive:
      command: "/sdd-archive"

skills:
  registry_path: ".atl/skill-registry.md"
  lockfile_path: "skills-lock.json"
  count: 42
  global_count: 25
  total_ecosystem_count: 67

persistence:
  mode: openspec
